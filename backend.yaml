- name: configure backend component
  hosts: backend
  become: yes
  tasks:
# we use the command module because we need to run dnf module commands.
# the service module is used to manage services, not dnf modules.
  - name: disable default nodejs
    ansible.builtin.command: dnf module disable nodejs -y

  - name: enable nodejs:20
    ansible.builtin.command: dnf module enable nodejs:20 -y

  - name: install nodejs
    ansible.builtin.dnf:
      name: nodejs
      state: present

  - name: create app directory
    ansible.builtin.file:
      path: /app
      state: directory
# in shell, we need to check whether the user already exists or not, but 
# in Ansible, the user module is Idempotent, so it automatically checks and creates the user only if needed. 
  - name: create expense user
    ansible.builtin.user:
      name: expense
      shell: /sbin/nologin
      system: true
      home: /app

  - name: download backend code
    ansible.builtin.get_url:
      url: https://expense-builds.s3.us-east-1.amazonaws.com/expense-backend-v2.zip
      dest: /tmp/backend.zip

# this module thinks file exist on ansible control server. needs to extract on to remote machine
# remote_src: yes means filrs already exist in user server
  - name: extract backend
    ansible.builtin.unarchive:
      src: /tmp/backend.zip
      dest: /app
      remote_src: yes

  - name: install dependencies
    community.general.npm:
      path: /app

  - name: copy backend service to system directory
    ansible.builtin.copy:
      src: backend.service
      dest: /etc/systemd/system/backend.service

  - name: systemctl deamon reload
    ansible.builtin.systemd_service:
      daemon_reload: true

  - name: start and enable backend
    ansible.builtin.service:
      name: backend
      state: started
      enabled: yes



  - name: install mysql
    ansible.builtin.dnf:
      name: "{{ item }}"
      state: installed
    loop:
    - mysql

  - name: install PyMySQL and cryptography
    ansible.builtin.pip:
      name: "{{ item }}"
      executable: pip3.9
    loop:
    - cryptography
    - PyMySQL
# Ansible is deployed using Python, so it uses Python to connect to MySQL.
# PyMySQL is used to connect to MySQL. and cryptography is used for the password authentication.

