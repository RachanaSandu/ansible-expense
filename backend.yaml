  - name: import data
    tags:
    - import
    community.mysql.mysql_db:
      name: all
      login_user: root
      login_password: ExpenseApp@1
      login_host: mysql.rachanadev.online
      state: import
      target: "{{ item }}"
    loop:
    - /app/schema/backend.sql 


# these tasks are idempotent. Idempotent means Running the same task again and again gives the same result without making unnecessary changes.
# check if the app user can connect to MySqL. if it can connect, the data is already imported. if it can't connect, the data may not be imported yet.
# if you want to run only a specific task, use tags.
# Example: ansible-playbook -i inventory.ini -e ansible_user=ec2-user -e ansible_password=give password here shipping.yaml -t import   
# -t means tags.  
# for the shipping component, we need to create a separate database user and password.
# the shipping application will use this user to connect to the database.

  - name: restart shipping
    tags: 
    - import
    ansible.builtin.service:
      state: restarted
      name: shipping

